<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Live GPS Coordinates</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>

<style>
body{
font-family: Arial;
padding:20px;
}

#log{
margin-top:20px;
font-size:18px;
line-height:1.6;
}

#map{
height:400px;
margin-top:20px;
}
</style>

</head>
<body>

<h2>Live Location Tracker</h2>

<button id="start">Start Tracking</button>
<button id="stop">Stop Tracking</button>

<div id="log"></div>

<div id="map"></div>

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<script>

let watchId = null;

const log = document.getElementById("log");

const map = L.map('map').setView([23.8103, 90.4125], 15);

L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png')
.addTo(map);

let route = [];

const polyline = L.polyline(route,{color:'red'}).addTo(map);
let marker = null;

function addPoint(lat,lng){

route.push([lat,lng]);

polyline.setLatLngs(route);

if(marker === null){
marker = L.marker([lat,lng]).addTo(map);
}else{
marker.setLatLng([lat,lng]);
}

map.setView([lat,lng]);

}

document.getElementById("start").onclick = () => {

if(!navigator.geolocation){
alert("Geolocation not supported");
return;
}

watchId = navigator.geolocation.watchPosition(

(position)=>{

const lat = position.coords.latitude;
const lng = position.coords.longitude;

const line = document.createElement("div");
line.textContent = lat.toFixed(6) + " , " + lng.toFixed(6);

log.appendChild(line);

addPoint(lat,lng);

},

(error)=>{
alert(error.message);
},

{
enableHighAccuracy:true,
maximumAge:0
}

);

};

document.getElementById("stop").onclick = ()=>{

if(watchId !== null){
navigator.geolocation.clearWatch(watchId);
}

};

</script>

</body>
</html>
